<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CRUD Form</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-GLhlTQ8iRABdZLl6O3oVMWSktQOp6b7In1Zl3/Jr59b6EGGoI1aFkw7cmDA6j6gD"
      crossorigin="anonymous"
    />
  </head>

  <body>
    <hr>
    <h1 class="text-center">Customer Registry System</h1>
    <hr>
    <div class="d-flex justify-content-around my-5">
      <button
        type="button"
        class="btn btn-success"
        onclick="displayForm('new')"
      >
        New
      </button>
      <button
        id="list"
        type="button"
        class="btn btn-primary"
        onclick="displayForm('list')"
      >
        List
      </button>
      <button
        type="button"
        class="btn btn-warning"
        onclick="displayForm('edit')"
      >
        Edit
      </button>
      <button
        type="button"
        class="btn btn-danger"
        onclick="displayForm('delete')"
      >
        Delete
      </button>
    </div>

    <!-- Add customer data form -->
    <section class="mx-auto my-3 w-75 new">
      <h1>Insert Customer Info</h1>
      <form
        style="zoom: 200%"
        id="create-form"
      >
        <label for="name">Name:</label><br />
        <input type="text" name="name" /><br /><br />

        <label for="address">Address:</label><br />
        <input type="text" name="address" /><br /><br />

        <label for="company">Company:</label><br />
        <input type="text" name="company" /><br /><br />

        <button type="submit" class="btn btn-dark">Add Customer</button>
      </form>
    </section>

    <!-- Update customer data form -->
    <section class="mx-auto my-3 w-75 edit" style="display: none">
      <h1>Update Customer Name</h1>

      <form id="update-form" style="zoom: 200%">
        <label for="name">ID:</label><br />
        <input type="text" name="id" /><br /><br />

        <label for="name">New Name:</label><br />
        <input type="text" name="updatedName" /><br /><br />
        <button class="btn btn-dark">Submit Updated Name</button>
      </form>
    </section>

    <!-- Delete customer data -->
    <section class="mx-auto my-3 w-75 delete" style="display: none">
      <h1>Delete User</h1>

      <form id="delete-form" style="zoom: 200%">
        <label for="name">ID:</label><br />
        <input type="text" name="id" /><br /><br />
        <button type="submit" class="btn btn-dark">Delete User</button>
      </form>
    </section>

    <!-- section for listing customers -->
    <section id="data" class="my-3 container list" style="display: none">
      <h1 class="text-center mt-20">No registered customer yet.</h1>
    </section>

    <script src="./js/script.js"></script>
  </body>
</html>
